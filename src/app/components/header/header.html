<header class="barra-app">
  <a class="marca" routerLink="/agenda" aria-label="Meu Dia, ir para a agenda">
    <mat-icon>event_note</mat-icon>
    <span class="marca-nome">Meu Dia</span>
  </a>

  @if (logado) {
    <!-- as abas da agenda moram no topo; em outra tela levam de volta a ela -->
    <nav class="abas" aria-label="Visões da agenda">
      @for (aba of abas; track aba.visao) {
        <a
          routerLink="/agenda"
          [queryParams]="{ visao: aba.visao === 'calendario' ? null : aba.visao }"
          [class.ativo]="naAgenda() && visao() === aba.visao"
          [attr.aria-current]="naAgenda() && visao() === aba.visao ? 'page' : null"
        >
          {{ aba.rotulo }}
        </a>
      }
    </nav>
  }

  <div class="acoes">
    @if (logado) {
      <button type="button" class="btn-config" aria-label="Configurações" (click)="abrirConfiguracoes.emit()">
        <mat-icon>settings</mat-icon>
      </button>
      <span class="avatar" [title]="email" aria-hidden="true">{{ inicial }}</span>
    } @else {
      <a routerLink="/login">Entrar</a>
    }
  </div>
</header>
