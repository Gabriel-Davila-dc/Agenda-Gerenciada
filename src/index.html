<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Meu Dia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f4b7c" />
    <script>
      // Tema escolhido em Configurações (ThemeService); aplicado antes do app para não piscar.
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.theme = tema;
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
